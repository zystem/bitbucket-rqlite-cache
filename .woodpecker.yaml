steps:
  build:
    image: nimlang/nim:2.2.4-alpine@sha256:47a9afd5e2d02f6a48fa13235462cb7356c4a04f7705689829f15b29d3fd8c4b
    commands:
      - apk add --no-cache gcc musl-dev openssl-dev pcre-dev git
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - nimble install -y https://github.com/zystem/nim-posixglob
      - nimble test -y
      - nimble buildRelease -y
    when:
      - event: push
      - event: pull_request
      - event: tag

  package_release:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    commands:
      - mkdir -p dist
      - cp build/bitbucket-rqlite-cache dist/bitbucket-rqlite-cache-linux-amd64
      - chmod +x dist/bitbucket-rqlite-cache-linux-amd64
      - sha256sum dist/bitbucket-rqlite-cache-linux-amd64 > dist/bitbucket-rqlite-cache-linux-amd64.sha256
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  helm:
    image: alpine/helm:3.15.4@sha256:105741fa6621ed9a3ea944066de78bb27d4b9bb93a56ce8e7cb4d621e1e4bbf2
    commands:
      - helm lint helm/bitbucket-rqlite-cache
      - >
        helm template bitbucket-rqlite-cache helm/bitbucket-rqlite-cache
        --namespace automation
        --set env.BITBUCKET_WORKSPACE=test
        --set env.BITBUCKET_USER=user@example.com
        --set env.BITBUCKET_TOKEN=app-password
        --set env.RQLITE_URL=http://rqlite:4001
      - helm package helm/bitbucket-rqlite-cache --destination build/helm
    when:
      - event: push
      - event: pull_request
      - event: tag

  publish_helm:
    image: alpine/helm:3.15.4@sha256:105741fa6621ed9a3ea944066de78bb27d4b9bb93a56ce8e7cb4d621e1e4bbf2
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - echo "$${GHCR_TOKEN}" | helm registry login ghcr.io --username "$CI_REPO_OWNER" --password-stdin
      - helm push build/helm/*.tgz "oci://ghcr.io/$CI_REPO_OWNER/charts"
    depends_on:
      - helm
    when:
      - event: tag
        ref: refs/tags/v*

  publish_image:
    image: woodpeckerci/plugin-docker-buildx:5.2.2@sha256:ccb9072d4f51dc6ec106b364c6806c6647c93c59594f2d10d121f94b0566591f
    settings:
      registry: ghcr.io
      repo: ghcr.io/${CI_REPO}
      username: ${CI_REPO_OWNER}
      password:
        from_secret: ghcr_token
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - ${CI_COMMIT_TAG##v}
        - ${CI_COMMIT_TAG}
        - latest
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  publish_release:
    image: woodpeckerci/plugin-release:0.3.1@sha256:3fa3a8de080151bbe5c9647b31793a46cc2cfc489741bf48835265edb85ca739
    settings:
      api-key:
        from_secret: github_token
      files:
        - dist/*
      file-exists: overwrite
      generate-release-notes: true
      title: ${CI_COMMIT_TAG}
    depends_on:
      - package_release
      - publish_helm
      - publish_image
    when:
      - event: tag
        ref: refs/tags/v*

  renovate:
    image: renovate/renovate:latest@sha256:253ff2045cd2c8cdd2d07770a60bf8d3dd590ba8e82d85fd4ed381e43dccad9b
    commands:
      - renovate "$CI_REPO"
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_TOKEN:
        from_secret: renovate_token
    when:
      - event: cron
        cron: renovate
      - event: manual
