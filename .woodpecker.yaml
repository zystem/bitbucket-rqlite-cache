steps:
  build:
    image: nimlang/nim:2.2.4-alpine@sha256:47a9afd5e2d02f6a48fa13235462cb7356c4a04f7705689829f15b29d3fd8c4b
    commands:
      - apk add --no-cache gcc musl-dev openssl-dev pcre-dev git
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - nimble install -y https://github.com/zystem/nim-posixglob
      - nimble test -y
      - nimble buildRelease -y
    when:
      - event: push
      - event: pull_request
      - event: tag

  package_release:
    image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    commands:
      - mkdir -p dist
      - cp build/bitbucket-rqlite-cache dist/bitbucket-rqlite-cache-linux-amd64
      - chmod +x dist/bitbucket-rqlite-cache-linux-amd64
      - cp LICENSE dist/
      - sha256sum dist/bitbucket-rqlite-cache-linux-amd64 > dist/bitbucket-rqlite-cache-linux-amd64.sha256
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  helm:
    image: alpine/helm:4.3.1@sha256:e3f8d5c462d75470fbb1fce79ad5c20063657096d1f98c0fcea869e2600e2e5e
    commands:
      - cp LICENSE helm/bitbucket-rqlite-cache/LICENSE
      - helm lint helm/bitbucket-rqlite-cache
      - >
        helm template bitbucket-rqlite-cache helm/bitbucket-rqlite-cache
        --namespace automation
        --set env.BITBUCKET_WORKSPACE=test
        --set env.BITBUCKET_USER=user@example.com
        --set env.BITBUCKET_TOKEN=app-password
        --set env.RQLITE_URL=http://rqlite:4001
      - helm package helm/bitbucket-rqlite-cache --destination build/helm
    when:
      - event: push
      - event: pull_request
      - event: tag

  publish_helm:
    image: alpine/helm:4.3.1@sha256:e3f8d5c462d75470fbb1fce79ad5c20063657096d1f98c0fcea869e2600e2e5e
    environment:
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - echo "$${GHCR_TOKEN}" | helm registry login ghcr.io --username "$CI_REPO_OWNER" --password-stdin
      - helm push build/helm/*.tgz "oci://ghcr.io/$CI_REPO_OWNER/charts"
    depends_on:
      - helm
    when:
      - event: tag
        ref: refs/tags/v*

  publish_image:
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    settings:
      registry: ghcr.io
      repo: ghcr.io/${CI_REPO}
      username: ${CI_REPO_OWNER}
      password:
        from_secret: github_token
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - ${CI_COMMIT_TAG##v}
        - ${CI_COMMIT_TAG}
        - latest
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  publish_release:
    image: woodpeckerci/plugin-release:1.0.0@sha256:13277e795ac97a41e0e89a0b001e31a561baff912dcfe272a267bee0dda08fa1
    settings:
      api-key:
        from_secret: github_token
      files:
        - dist/*
      file-exists: overwrite
      generate-release-notes: true
      title: ${CI_COMMIT_TAG}
    depends_on:
      - package_release
      - publish_helm
      - publish_image
    when:
      - event: tag
        ref: refs/tags/v*

  renovate:
    image: renovate/renovate:latest@sha256:7dba1a3b916a2cf302ba0df458ddcc8fcbac3c92d0fe9882ac13ba0363de656b
    commands:
      - renovate "$CI_REPO"
    environment:
      RENOVATE_PLATFORM: github
      RENOVATE_TOKEN:
        from_secret: renovate_token
    when:
      - event: cron
        cron: renovate
      - event: manual
